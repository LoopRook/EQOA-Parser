[project]
name = "eqoa-parser"
version = "0.4.0"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]   # the default window; without it the classic Tk window is used

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
